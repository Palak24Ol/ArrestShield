[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrestshield-ml"
version = "0.1.0"
description = "Multilingual trained scam detector for ArrestShield"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib==1.4.2",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "scipy==1.13.1",
  "sentencepiece==0.2.0",
  "torch==2.5.1",
  "transformers==4.48.3",
  "xgboost==2.1.4",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
